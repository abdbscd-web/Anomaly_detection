[project]
name = "anomaly-mcp"
version = "0.1.0"
description = "Anomaly detection MCP server (statistical detectors + Claude-powered analysis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "anthropic>=0.40.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
anomaly-mcp = "anomaly_mcp.server:main"
anomaly-dashboard = "anomaly_mcp.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
